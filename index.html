<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PROJETO INTEGRADOR 🚀</title>

    <style>

        /* =========================
           CONFIGURAÇÕES GERAIS
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #07111f;
            color: #e2e8f0;
            line-height: 1.7;
        }


        /* =========================
           MENU
        ========================= */

        .menu {
            position: sticky;
            top: 0;
            z-index: 1000;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;

            gap: 25px;

            padding: 18px;

            background: rgba(2, 6, 23, 0.95);

            backdrop-filter: blur(10px);

            border-bottom: 2px solid #38bdf8;
        }

        .menu a {
            color: white;

            text-decoration: none;

            font-weight: bold;

            transition: 0.3s;
        }

        .menu a:hover {
            color: #38bdf8;

            transform: scale(1.1);
        }


        /* =========================
           CAPA
        ========================= */

        .capa {
            min-height: 85vh;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 40px 20px;

            background:

                radial-gradient(
                    circle at top,
                    #164e63,
                    transparent 40%
                ),

                linear-gradient(
                    135deg,
                    #020617,
                    #172554,
                    #312e81
                );
        }

        .capa-conteudo {
            max-width: 900px;
        }

        .robot {
            font-size: 90px;

            animation:
                flutuar 3s ease-in-out infinite;
        }

        .capa h1 {
            font-size: clamp(42px, 8vw, 75px);

            color: white;

            text-shadow:
                0 0 10px #38bdf8,
                0 0 30px #38bdf8;

            margin: 20px 0;
        }

        .capa h2 {
            color: #7dd3fc;

            font-size: 25px;
        }

        .capa p {
            background: transparent;

            border: none;

            box-shadow: none;

            font-size: 18px;

            margin-top: 15px;
        }


        /* =========================
           ANIMAÇÃO DO ROBÔ
        ========================= */

        @keyframes flutuar {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }

        }


        /* =========================
           SEÇÕES
        ========================= */

        section {
            max-width: 1150px;

            margin: auto;

            padding: 80px 25px;
        }


        /* =========================
           TÍTULOS
        ========================= */

        .titulo {
            text-align: center;

            margin-bottom: 45px;
        }

        .titulo h2 {
            font-size: 40px;

            color: #38bdf8;

            text-shadow:
                0 0 10px rgba(56,189,248,0.4);
        }

        .linha {
            width: 100px;

            height: 4px;

            margin: 12px auto;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    #38bdf8,
                    #a855f7
                );
        }


        /* =========================
           CAIXAS
        ========================= */

        .caixa {
            background:
                linear-gradient(
                    145deg,
                    rgba(30,41,59,0.95),
                    rgba(15,23,42,0.95)
                );

            border: 1px solid #334155;

            border-radius: 22px;

            padding: 35px;

            margin-bottom: 30px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.3);

            transition: 0.4s;
        }

        .caixa:hover {
            transform: translateY(-5px);

            border-color: #38bdf8;

            box-shadow:
                0 20px 45px
                rgba(56,189,248,0.15);
        }

        .caixa p {
            background: transparent;

            border: none;

            box-shadow: none;

            padding: 0;

            margin-bottom: 20px;
        }

        .caixa p:last-child {
            margin-bottom: 0;
        }


        /* =========================
           FOTO DA TURMA
        ========================= */

        .foto-turma {
            margin-top: 35px;

            padding: 30px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(30,41,59,0.95),
                    rgba(15,23,42,0.95)
                );

            border: 1px solid #334155;

            border-radius: 22px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.3);

            transition: 0.4s;
        }

        .foto-turma:hover {
            transform: translateY(-5px);

            border-color: #38bdf8;

            box-shadow:
                0 20px 45px
                rgba(56,189,248,0.15);
        }

        .foto-turma h3 {
            color: #38bdf8;

            font-size: 28px;

            margin-bottom: 20px;
        }

        .foto-turma img {
            width: 100%;

            max-width: 950px;

            display: block;

            margin: auto;

            border-radius: 18px;

            border: 2px solid #38bdf8;

            box-shadow:
                0 0 25px
                rgba(56,189,248,0.25);

            transition: 0.4s;
        }

        .foto-turma img:hover {
            transform: scale(1.02);

            box-shadow:
                0 0 35px
                rgba(56,189,248,0.55);
        }

        .foto-turma p {
            color: #94a3b8;

            margin-top: 18px;
        }


        /* =========================
           TÓPICOS
        ========================= */

        .topicos {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;

            margin-top: 30px;
        }

        .topico {
            background: #111827;

            border: 1px solid #334155;

            border-radius: 18px;

            padding: 25px;

            text-align: center;

            transition: 0.4s;
        }

        .topico:hover {
            transform: translateY(-8px);

            border-color: #38bdf8;

            box-shadow:
                0 10px 30px
                rgba(56,189,248,0.2);
        }

        .topico .icone {
            font-size: 45px;
        }

        .topico h3 {
            color: #38bdf8;

            margin: 10px 0;
        }

        .topico p {
            color: #94a3b8;
        }


        /* =========================
           PROJETOS
        ========================= */

        .projetos {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 25px;
        }

        .projeto {
            background: #111827;

            border-radius: 20px;

            padding: 25px;

            border: 1px solid #334155;

            transition: 0.4s;
        }

        .projeto:hover {
            transform: translateY(-8px);

            border-color: #8b5cf6;

            box-shadow:
                0 15px 35px
                rgba(139,92,246,0.2);
        }

        .projeto h3 {
            color: #a78bfa;

            margin-bottom: 10px;
        }

        .projeto p {
            background: transparent;

            border: none;

            box-shadow: none;

            padding: 0;
        }

        .projeto img {
            width: 100%;

            height: 230px;

            object-fit: cover;

            margin-top: 20px;

            border-radius: 15px;

            border: 2px solid #38bdf8;

            box-shadow:
                0 0 20px
                rgba(56,189,248,0.25);

            transition: 0.4s;
        }

        .projeto img:hover {
            transform: scale(1.04);

            box-shadow:
                0 0 30px
                rgba(56,189,248,0.6);
        }


        /* =========================
           VÍDEOS DE ROBÓTICA
        ========================= */

        .videos-robotica {
            margin-top: 70px;
        }

        .videos-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 25px;
        }

        .video {
            background: #111827;

            border: 1px solid #334155;

            border-radius: 20px;

            padding: 20px;

            transition: 0.4s;
        }

        .video:hover {
            transform: translateY(-8px);

            border-color: #a855f7;

            box-shadow:
                0 15px 35px
                rgba(168,85,247,0.2);
        }

        .video h3 {
            color: #a78bfa;

            font-size: 21px;

            margin-bottom: 15px;
        }

        .video video {
            width: 100%;

            display: block;

            border-radius: 15px;

            border: 2px solid #38bdf8;

            background: #020617;

            box-shadow:
                0 0 20px
                rgba(56,189,248,0.2);
        }

        .video p {
            color: #94a3b8;

            margin-top: 15px;
        }


        /* =========================
           DESTAQUE DO ROBÔ
        ========================= */

        .destaque {
            text-align: center;

            padding: 50px 30px;

            margin-top: 40px;

            border-radius: 25px;

            background:
                linear-gradient(
                    135deg,
                    #172554,
                    #312e81
                );

            border: 1px solid #6366f1;

            box-shadow:
                0 20px 50px
                rgba(99,102,241,0.2);
        }

        .destaque .icone {
            font-size: 80px;
        }

        .destaque h2 {
            color: white;

            margin: 15px;
        }

        .destaque p {
            background: transparent;

            border: none;

            box-shadow: none;
        }

        .destaque img {
            width: 90%;

            max-width: 600px;

            border-radius: 20px;

            border: 3px solid #38bdf8;

            box-shadow:
                0 0 25px
                rgba(56,189,248,0.3);

            transition: 0.4s;
        }

        .destaque img:hover {
            transform: scale(1.03);

            box-shadow:
                0 0 35px
                rgba(56,189,248,0.6);
        }


        /* =========================
           TECNOLOGIAS
        ========================= */

        .tecnologias {
            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 15px;
        }

        .tecnologia {
            background: #1e293b;

            border: 1px solid #38bdf8;

            color: #7dd3fc;

            padding: 12px 22px;

            border-radius: 30px;

            font-weight: bold;

            transition: 0.3s;
        }

        .tecnologia:hover {
            background: #38bdf8;

            color: #082f49;

            transform: scale(1.08);
        }


        /* =========================
           RODAPÉ
        ========================= */

        footer {
            text-align: center;

            padding: 40px 20px;

            background: #020617;

            border-top: 1px solid #334155;

            color: #64748b;
        }

        footer strong {
            color: #38bdf8;
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 1000px) {

            .topicos {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        /* =========================
